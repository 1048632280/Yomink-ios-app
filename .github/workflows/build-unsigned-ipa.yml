name: Build Unsigned IPA and Test

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "codex/**"
    paths:
      - "Yomink/**"
      - "YominkTests/**"
      - "Yomink.xcodeproj/**"
      - ".github/workflows/build-unsigned-ipa.yml"

env:
  PROJECT: Yomink.xcodeproj
  SCHEME: Yomink

jobs:
  build-ipa:
    name: Build unsigned IPA
    runs-on: macos-15

    env:
      CONFIGURATION: Release
      ARCHIVE_PATH: build/Yomink.xcarchive
      IPA_PATH: artifacts/Yomink-unsigned.ipa

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Cache SwiftPM dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            ~/Library/org.swift.swiftpm
            ~/Library/Developer/Xcode/DerivedData/**/SourcePackages
          key: ${{ runner.os }}-spm-${{ hashFiles('Yomink.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Resolve Swift packages
        run: |
          xcodebuild \
            -resolvePackageDependencies \
            -project "$PROJECT" \
            -scheme "$SCHEME"

      - name: Archive without code signing
        run: |
          xcodebuild archive \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration "$CONFIGURATION" \
            -destination "generic/platform=iOS" \
            -archivePath "$ARCHIVE_PATH" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=NO

      - name: Package unsigned IPA
        run: |
          APP_PATH="$ARCHIVE_PATH/Products/Applications/Yomink.app"
          test -d "$APP_PATH"
          rm -rf build/Payload artifacts
          mkdir -p build/Payload
          mkdir -p artifacts
          cp -R "$APP_PATH" build/Payload/
          (cd build && zip -qry "../$IPA_PATH" Payload)
          test -f "$IPA_PATH"
          ls -lh "$IPA_PATH"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Yomink-unsigned-ipa-${{ github.run_number }}
          path: artifacts/Yomink-unsigned.ipa
          if-no-files-found: error
          retention-days: 14

  run-tests:
    name: Run unit tests
    runs-on: macos-15

    env:
      CONFIGURATION: Debug

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Cache SwiftPM dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            ~/Library/org.swift.swiftpm
            ~/Library/Developer/Xcode/DerivedData/**/SourcePackages
          key: ${{ runner.os }}-spm-${{ hashFiles('Yomink.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Resolve Swift packages
        run: |
          xcodebuild \
            -resolvePackageDependencies \
            -project "$PROJECT" \
            -scheme "$SCHEME"

      - name: Prepare iOS simulator
        run: |
          set -euo pipefail

          DEVICE_ID="$(xcrun simctl list devices available --json | python3 -c 'import json,sys; data=json.load(sys.stdin); devices=[device for runtime_devices in data.get("devices", {}).values() for device in runtime_devices if device.get("isAvailable") and device.get("name", "").startswith("iPhone")]; devices.sort(key=lambda device: device.get("name", "")); print(devices[0]["udid"] if devices else "")')"

          if [ -z "$DEVICE_ID" ]; then
            RUNTIME_ID="$(xcrun simctl list runtimes --json | python3 -c 'import json,sys; data=json.load(sys.stdin); runtimes=[runtime for runtime in data.get("runtimes", []) if runtime.get("isAvailable") and runtime.get("platform") == "iOS"]; runtimes.sort(key=lambda runtime: tuple(int(part) for part in runtime.get("version", "0").split(".") if part.isdigit()), reverse=True); print(runtimes[0]["identifier"] if runtimes else "")')"

            DEVICE_TYPE="$(xcrun simctl list devicetypes --json | python3 -c 'import json,sys; data=json.load(sys.stdin); types=[device_type for device_type in data.get("devicetypes", []) if device_type.get("name", "").startswith("iPhone")]; preferred=("iPhone 16 Pro", "iPhone 16", "iPhone 15 Pro", "iPhone 15"); by_name={device_type.get("name"): device_type for device_type in types}; selected=next((by_name[name] for name in preferred if name in by_name), types[-1] if types else None); print(selected["identifier"] if selected else "")')"

            if [ -z "$RUNTIME_ID" ] || [ -z "$DEVICE_TYPE" ]; then
              echo "No available iOS simulator runtime/device type found." >&2
              xcrun simctl list runtimes
              xcrun simctl list devicetypes
              exit 1
            fi

            DEVICE_ID="$(xcrun simctl create "Yomink Test iPhone" "$DEVICE_TYPE" "$RUNTIME_ID")"
          fi

          echo "SIMULATOR_TEST_DESTINATION=platform=iOS Simulator,id=$DEVICE_ID" >> "$GITHUB_ENV"
          xcrun simctl boot "$DEVICE_ID" || true
          xcrun simctl bootstatus "$DEVICE_ID" -b

      - name: Build for testing
        run: |
          xcodebuild build-for-testing \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration "$CONFIGURATION" \
            -destination "$SIMULATOR_TEST_DESTINATION" \
            -parallel-testing-enabled NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Run unit tests
        run: |
          xcodebuild test-without-building \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration "$CONFIGURATION" \
            -destination "$SIMULATOR_TEST_DESTINATION" \
            -parallel-testing-enabled NO \
            -maximum-concurrent-test-simulator-destinations 1 \
            CODE_SIGNING_ALLOWED=NO
