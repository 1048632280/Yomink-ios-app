name: Build Unsigned IPA and Test

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "codex/**"
    paths:
      - "Yomink/**"
      - "YominkTests/**"
      - "Yomink.xcodeproj/**"
      - ".github/workflows/build-unsigned-ipa.yml"

env:
  PROJECT: Yomink.xcodeproj
  SCHEME: Yomink

jobs:
  build-ipa:
    name: Build unsigned IPA
    runs-on: macos-15

    env:
      CONFIGURATION: Release
      ARCHIVE_PATH: build/Yomink.xcarchive
      IPA_PATH: artifacts/Yomink-unsigned.ipa

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Cache SwiftPM dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            ~/Library/org.swift.swiftpm
            ~/Library/Developer/Xcode/DerivedData/**/SourcePackages
          key: ${{ runner.os }}-spm-${{ hashFiles('Yomink.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Resolve Swift packages
        run: |
          xcodebuild \
            -resolvePackageDependencies \
            -project "$PROJECT" \
            -scheme "$SCHEME"

      - name: Archive without code signing
        run: |
          xcodebuild archive \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration "$CONFIGURATION" \
            -destination "generic/platform=iOS" \
            -archivePath "$ARCHIVE_PATH" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=NO

      - name: Package unsigned IPA
        run: |
          APP_PATH="$ARCHIVE_PATH/Products/Applications/Yomink.app"
          test -d "$APP_PATH"
          rm -rf build/Payload artifacts
          mkdir -p build/Payload
          mkdir -p artifacts
          cp -R "$APP_PATH" build/Payload/
          (cd build && zip -qry "../$IPA_PATH" Payload)
          test -f "$IPA_PATH"
          ls -lh "$IPA_PATH"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Yomink-unsigned-ipa-${{ github.run_number }}
          path: artifacts/Yomink-unsigned.ipa
          if-no-files-found: error
          retention-days: 14

  run-tests:
    name: Run unit tests
    runs-on: macos-15

    env:
      CONFIGURATION: Debug
      SIMULATOR_TEST_DESTINATION: platform=iOS Simulator,name=iPhone 16,OS=latest,arch=arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Cache SwiftPM dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            ~/Library/org.swift.swiftpm
            ~/Library/Developer/Xcode/DerivedData/**/SourcePackages
          key: ${{ runner.os }}-spm-${{ hashFiles('Yomink.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Resolve Swift packages
        run: |
          xcodebuild \
            -resolvePackageDependencies \
            -project "$PROJECT" \
            -scheme "$SCHEME"

      - name: Build for testing
        run: |
          xcodebuild build-for-testing \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration "$CONFIGURATION" \
            -destination "$SIMULATOR_TEST_DESTINATION" \
            -parallel-testing-enabled NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Run unit tests
        run: |
          xcodebuild test-without-building \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration "$CONFIGURATION" \
            -destination "$SIMULATOR_TEST_DESTINATION" \
            -parallel-testing-enabled NO \
            -maximum-concurrent-test-simulator-destinations 1 \
            CODE_SIGNING_ALLOWED=NO
