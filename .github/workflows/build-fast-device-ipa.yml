name: Build Fast Device IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "codex/**"
    paths:
      - "Yomink/**"
      - "Yomink.xcodeproj/**"
      - ".github/workflows/build-fast-device-ipa.yml"

jobs:
  build:
    name: Build fast device IPA
    runs-on: macos-15

    env:
      PROJECT: Yomink.xcodeproj
      SCHEME: Yomink
      CONFIGURATION: Debug
      DESTINATION: generic/platform=iOS
      DERIVED_DATA_PATH: build/DerivedData
      APP_PATH: build/DerivedData/Build/Products/Debug-iphoneos/Yomink.app
      IPA_PATH: artifacts/Yomink-fast-device.ipa

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Cache SwiftPM dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            ~/Library/org.swift.swiftpm
            ~/Library/Developer/Xcode/DerivedData/**/SourcePackages
          key: ${{ runner.os }}-spm-${{ hashFiles('Yomink.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Resolve Swift packages
        run: |
          xcodebuild \
            -resolvePackageDependencies \
            -project "$PROJECT" \
            -scheme "$SCHEME"

      - name: Build Debug device app
        run: |
          xcodebuild build \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration "$CONFIGURATION" \
            -destination "$DESTINATION" \
            -derivedDataPath "$DERIVED_DATA_PATH" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO

      - name: Package fast IPA
        run: |
          test -d "$APP_PATH"
          rm -rf build/Payload artifacts
          mkdir -p build/Payload
          mkdir -p artifacts
          cp -R "$APP_PATH" build/Payload/
          (cd build && zip -qry "../$IPA_PATH" Payload)
          test -f "$IPA_PATH"
          ls -lh "$IPA_PATH"
          {
            echo "## Fast Device IPA"
            echo ""
            echo "- Artifact: \`Yomink-fast-device-ipa-${{ github.run_number }}\`"
            echo "- File: \`$IPA_PATH\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload fast IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Yomink-fast-device-ipa-${{ github.run_number }}
          path: artifacts/Yomink-fast-device.ipa
          if-no-files-found: error
          retention-days: 14
